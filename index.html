<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Stumphauzer Codex — 1823–2014</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;color:#cfefff;font-family:'Helvetica Neue',system-ui,sans-serif;overflow:hidden;}
  canvas{display:block;}
  #hud{position:fixed;left:0;right:0;top:0;padding:14px 18px;pointer-events:none;z-index:5;}
  #title{font-family:'Times New Roman',serif;font-weight:300;letter-spacing:.35em;font-size:14px;color:#a8e6ff;text-transform:uppercase;}
  #subtitle{font-family:'Times New Roman',serif;font-style:italic;font-size:11px;color:#6fb2cc;letter-spacing:.1em;margin-top:4px;}
  #help{position:fixed;left:18px;bottom:18px;font-size:11px;line-height:1.6;color:#6fb2cc;z-index:5;pointer-events:none;max-width:240px;}
  #help kbd{background:rgba(90,180,220,.15);border:1px solid rgba(120,200,240,.3);padding:1px 5px;border-radius:3px;color:#a8e6ff;font-family:ui-monospace,monospace;font-size:10px;}
  #index{position:fixed;right:0;top:0;bottom:0;width:260px;background:linear-gradient(to left,rgba(0,10,20,.92),rgba(0,10,20,.6) 80%,transparent);padding:60px 18px 20px;overflow:auto;z-index:4;pointer-events:auto;transition:transform .4s ease;}
  #index.hidden{transform:translateX(100%);}
  #index h3{font-size:10px;font-weight:400;letter-spacing:.3em;color:#a8e6ff;text-transform:uppercase;margin:16px 0 8px;border-bottom:1px solid rgba(120,200,240,.2);padding-bottom:4px;}
  #index a{display:block;color:#cfefff;font-size:12px;padding:3px 0;text-decoration:none;cursor:pointer;opacity:.75;transition:opacity .15s,color .15s,padding-left .15s;}
  #index a:hover{opacity:1;color:#fff;padding-left:4px;}
  #index a.narrative{color:#ffcb70;}
  #toggle-index{position:fixed;right:18px;top:14px;z-index:6;background:rgba(0,10,20,.6);border:1px solid rgba(120,200,240,.3);color:#a8e6ff;padding:6px 10px;font-size:10px;letter-spacing:.2em;cursor:pointer;border-radius:2px;text-transform:uppercase;}
  #toggle-index:hover{background:rgba(30,70,100,.7);}
  #panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);background:rgba(4,14,24,.94);border:1px solid rgba(120,200,240,.35);box-shadow:0 0 60px rgba(80,180,240,.25),inset 0 0 30px rgba(40,120,180,.1);padding:30px 34px;max-width:540px;max-height:70vh;overflow:auto;z-index:10;display:none;backdrop-filter:blur(8px);opacity:0;transition:opacity .25s,transform .25s;border-radius:3px;}
  #panel.visible{display:block;opacity:1;transform:translate(-50%,-50%) scale(1);}
  #panel h2{font-family:'Times New Roman',serif;font-weight:300;color:#fff;margin:0 0 4px;font-size:22px;letter-spacing:.02em;}
  #panel .gen{font-size:10px;letter-spacing:.3em;color:#7fc4e6;text-transform:uppercase;margin-bottom:14px;}
  #panel .row{display:flex;gap:10px;margin:4px 0;font-size:13px;line-height:1.5;}
  #panel .row .k{color:#7fc4e6;min-width:70px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;padding-top:2px;}
  #panel .row .v{color:#e8f7ff;flex:1;}
  #panel .note{margin-top:16px;padding-top:14px;border-top:1px solid rgba(120,200,240,.2);font-size:13px;line-height:1.65;color:#c0e0f0;font-style:italic;}
  #panel .narr{font-size:13px;line-height:1.8;color:#e0f0fb;white-space:pre-wrap;}
  #close{position:absolute;top:10px;right:14px;background:none;border:none;color:#7fc4e6;font-size:22px;cursor:pointer;line-height:1;}
  #close:hover{color:#fff;}
  #panel .lineage{margin-top:14px;font-size:11px;color:#7fc4e6;letter-spacing:.05em;}
  #panel .lineage span{color:#e8f7ff;}
  #panel .children{margin-top:14px;padding-top:10px;border-top:1px solid rgba(120,200,240,.15);}
  #panel .children .clabel{font-size:10px;letter-spacing:.3em;color:#7fc4e6;text-transform:uppercase;margin-bottom:6px;}
  #panel .children a{display:inline-block;font-size:12px;color:#cfefff;margin-right:12px;margin-bottom:4px;text-decoration:none;cursor:pointer;border-bottom:1px dotted rgba(120,200,240,.3);padding-bottom:1px;}
  #panel .children a:hover{color:#fff;border-bottom-color:#fff;}
  #loader{position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .6s;}
  #loader.done{opacity:0;pointer-events:none;}
  #loader .bar{width:240px;height:1px;background:rgba(120,200,240,.2);position:relative;margin-top:18px;overflow:hidden;}
  #loader .bar::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,#a8e6ff,transparent);animation:scan 1.4s linear infinite;}
  @keyframes scan{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  #loader .t{font-family:'Times New Roman',serif;letter-spacing:.4em;font-size:11px;color:#a8e6ff;text-transform:uppercase;}
  .legend{position:fixed;left:18px;top:70px;font-size:10px;line-height:1.8;color:#6fb2cc;z-index:4;pointer-events:none;}
  .legend .sw{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:middle;transform:rotate(45deg);}

  #panel .locimg{margin:6px 0 18px;position:relative;border:1px solid rgba(120,200,240,.25);border-radius:3px;overflow:hidden;line-height:0;}
  #panel .locimg img{width:100%;height:180px;object-fit:cover;display:block;filter:saturate(.9) brightness(.95);}
  #panel .locimg .loccap{position:absolute;left:0;right:0;bottom:0;padding:5px 10px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#cfefff;background:linear-gradient(to top,rgba(0,10,20,.9),transparent);}
</style>
</head>

// TREE LAYOUT — recursive 3D phyllotaxis
// Each person placed on a sphere around its parent.
// Generation advances the radial step.
// ============================================================
const byId = {};
for (const person of P) byId[person.id] = person;

const roots = P.filter(x => !x.p);
const children = {};
for (const person of P) {
  if (!person.p) continue;
  if (!children[person.p]) children[person.p] = [];
  children[person.p].push(person);
}

// Count subtree size so parents give bigger arcs to bigger families
function subtreeSize(id) {
  const kids = children[id] || [];
  let s = 1;
  for (const k of kids) s += subtreeSize(k.id);
  byId[id]._sz = s;
  return s;
}
for (const r of roots) subtreeSize(r.id);

// Layout: place root at origin, then for each generation step outward
// Children placed on a spherical cap around direction from grandparent→parent
const GEN_STEP = 70;
const ROOT_STEP = 55;

function layout(node, parentDir, baseAngle, totalAngle, depth) {
  const kids = (children[node.id] || []).slice().sort((a,b)=> (b._sz||1) - (a._sz||1));
  // Spouses place close to the person (not spread as descendants)
  const realKids = kids.filter(k => !k.s);
  const spouses  = kids.filter(k =>  k.s);

  // Place spouses first — small offset beside parent
  spouses.forEach((sp, i) => {
    const off = new THREE.Vector3(
      (Math.random()-0.5)*2,
      (Math.random()-0.5)*0.5,
      (Math.random()-0.5)*2
    ).normalize().multiplyScalar(16 + i*4);
    sp.pos = node.pos.clone().add(off);
    layout(sp, parentDir, 0, 0, depth+1);
  });

  if (realKids.length === 0) return;

  // Compute the local frame from parent direction
  const forward = parentDir.clone().normalize();
  const up = Math.abs(forward.y) > 0.9 ? new THREE.Vector3(1,0,0) : new THREE.Vector3(0,1,0);
  const right = new THREE.Vector3().crossVectors(forward, up).normalize();
  const ortho = new THREE.Vector3().crossVectors(right, forward).normalize();

  // Angular fan — wider at shallow depth, narrower deep
  const fan = Math.min(Math.PI * 0.95, Math.max(0.5, Math.PI/Math.max(1,depth)));
  const step = depth === 0 ? ROOT_STEP*1.8 : GEN_STEP * (1 + 0.02*depth);

  const totalSz = realKids.reduce((s,k)=>s+(k._sz||1),0);
  let angleCursor = -fan/2;

  realKids.forEach((kid, i) => {
    const wedge = fan * ((kid._sz||1)/totalSz);
    const localAngle = angleCursor + wedge/2;
    angleCursor += wedge;

    // Add a phyllotaxis-style secondary rotation so siblings don't collapse into a line
    const phyllo = i * 2.399963;
    const tilt = (Math.random() - 0.5) * 0.4 + (depth * 0.25);

    // Direction in parent's local frame
    const dir = forward.clone()
      .multiplyScalar(Math.cos(localAngle))
      .add(right.clone().multiplyScalar(Math.sin(localAngle) * Math.cos(phyllo + tilt)))
      .add(ortho.clone().multiplyScalar(Math.sin(localAngle) * Math.sin(phyllo + tilt)))
      .normalize();

    kid.pos = node.pos.clone().add(dir.clone().multiplyScalar(step));
    layout(kid, dir, 0, 0, depth+1);
  });
}

// Root placement
for (const r of roots) r.pos = new THREE.Vector3(0, 0, 0);
for (const r of roots) layout(r, new THREE.Vector3(0, 0, 1), 0, Math.PI*2, 0);

// ---------- Location → image resolution + texture cache ----------
const LOC_IMG = JSON.parse(document.getElementById('loc-img').textContent);

function extractLoc(s) {
  if (!s) return null;
  // Prefer the text after the 4-digit year token. Handles "5 Jul 1883, Aldebrő, Hungary",
  // "c.1882 Hungary", "May/Jun 1954, Wayne, MI" — and strips any trailing ", age 72" parenthetical noise.
  let m = s.match(/\b(\d{4})\b[,\s]+(.+)$/);
  if (!m) return null;
  let tail = m[2].trim();
  // strip trailing ", age …" / ", buried …" / parenthetical residue
  tail = tail.replace(/,\s*(age|buried|stillborn)\b.*$/i, '').replace(/\s*\(.+?\)\s*$/, '').trim();
  return tail || null;
}

function resolveLoc(raw) {
  if (!raw) return null;
  const key = raw.trim();
  if (LOC_IMG[key]) return { key, url: LOC_IMG[key] };
  // progressive suffix match — "Amherst Manor Nursing Center, Amherst, Ohio" → "Amherst, Ohio"
  const parts = key.split(',').map(s => s.trim()).filter(Boolean);
  for (let i = 1; i < parts.length; i++) {
    const candidate = parts.slice(i).join(', ');
    if (LOC_IMG[candidate]) return { key: candidate, url: LOC_IMG[candidate] };
  }
  // try the first segment alone as a standalone key ("Saskatchewan")
  for (const p of parts) if (LOC_IMG[p]) return { key: p, url: LOC_IMG[p] };
  return null;
}

const textureCache = {};
function getLocationTexture(url, onReady) {
  const cached = textureCache[url];
  if (cached && cached.tex) { onReady(cached.tex); return; }
  if (cached && cached.queue) { cached.queue.push(onReady); return; }
  const entry = { queue: [onReady] };
  textureCache[url] = entry;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    const side = Math.min(img.naturalWidth, img.naturalHeight);
    const target = Math.min(side, 384);
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = target;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img,
      (img.naturalWidth  - side) / 2,
      (img.naturalHeight - side) / 2,
      side, side, 0, 0, target, target);
    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    entry.tex = tex;
    for (const cb of entry.queue) cb(tex);
    entry.queue = null;
  };
  img.onerror = () => { entry.tex = null; for (const cb of entry.queue) cb(null); entry.queue = null; };
  img.src = url;
}

function crystalMaterial(color, emissive, opacity) {
  return new THREE.MeshPhongMaterial({
    color, emissive, emissiveIntensity:1.0,
    shininess:90, specular:0xffffff,
    transparent:true, opacity:opacity||0.88,
    flatShading:true
  });
}

function makeCrystal(person) {
  // Colour & size family first
  let frameColor, size;
  if (person.s) {
    frameColor = 0x6666aa; size = 3.2;
  } else if (person.g <= 4) {
    frameColor = 0xffaa55; size = person.g === 1 ? 9 : 7.2 - person.g * 0.4;
  } else {
    frameColor = 0x4fc8f0; size = 4.2;
  }

  // Try to resolve a location for this person
  const locRaw = person.loc || extractLoc(person.b) || extractLoc(person.d);
  const resolved = resolveLoc(locRaw);
  person._locRaw  = locRaw;
  person._locKey  = resolved ? resolved.key : null;
  person._locUrl  = resolved ? resolved.url : null;

  if (resolved) {
    // 1x1 photo-billboard of the person's location
    const photoSize = size * 1.9;
    const mat = new THREE.SpriteMaterial({ color:0xffffff, transparent:true, depthWrite:true });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(photoSize, photoSize, 1);
    sprite.position.copy(person.pos);
    sprite.userData = { kind:'person', ref:person, baseScale:photoSize };

    // Glow frame behind the photo (slightly larger, additive)
    const frameMat = new THREE.SpriteMaterial({
      color: frameColor, transparent:true, opacity:0.55,
      blending:THREE.AdditiveBlending, depthWrite:false
    });
    const frame = new THREE.Sprite(frameMat);
    frame.scale.set(photoSize * 1.25, photoSize * 1.25, 1);
    frame.position.copy(person.pos);
    frame.userData = { isFrame:true, baseScale:photoSize * 1.25 };

    crystalGroup.add(frame);
    crystalGroup.add(sprite);
    pickables.push(sprite);
    sprite.userData.frame = frame;
    person._mesh = sprite;

    sprite.userData.bobPhase = Math.random() * Math.PI * 2;
    sprite.userData.baseY = person.pos.y;
    frame.userData.bobPhase = sprite.userData.bobPhase;
    frame.userData.baseY    = person.pos.y;

    getLocationTexture(resolved.url, (tex) => {
      if (tex) { mat.map = tex; mat.needsUpdate = true; }
    });
    return sprite;
  }

  // Fallback: crystal octahedron
  const color = person.s ? 0xa8a8c0 : (person.g <= 4 ? 0xffd27a : 0x88e0ff);
  const emissive = person.s ? 0x555580 : (person.g <= 4 ? 0xff8a20 : 0x2a7ba8);
  const xsize = person.s ? 1.8 : (person.g <= 4 ? (4.5 - person.g * 0.4) : 2.6);
  const geo = new THREE.OctahedronGeometry(xsize, 0);
  const mesh = new THREE.Mesh(geo, crystalMaterial(color, emissive));
  mesh.position.copy(person.pos);
  mesh.userData = { kind:'person', ref:person };
  const glow = new THREE.Mesh(
    new THREE.OctahedronGeometry(xsize * 1.6, 0),
    new THREE.MeshBasicMaterial({ color: frameColor, transparent:true, opacity:0.18, blending:THREE.AdditiveBlending, depthWrite:false })
  );
  mesh.add(glow);
  mesh.userData.spinRate = (Math.random() - 0.5) * 0.4 + 0.3;
  mesh.userData.bobPhase = Math.random() * Math.PI * 2;
  mesh.userData.baseY = person.pos.y;
  crystalGroup.add(mesh);
  pickables.push(mesh);
  person._mesh = mesh;
  return mesh;
}

for (const person of P) makeCrystal(person);

// ============================================================
// PARENT-CHILD CONNECTION LINES
// ============================================================
const lineMat = new THREE.LineBasicMaterial({color:0x3a9ad0, transparent:true, opacity:0.22, depthWrite:false});
const spouseLineMat = new THREE.LineBasicMaterial({color:0x886699, transparent:true, opacity:0.3, depthWrite:false});
const lines = new THREE.Group();
scene.add(lines);

for (const person of P) {
  if (!person.p) continue;
  const parent = byId[person.p];
  if (!parent || !parent.pos || !person.pos) continue;
  const g = new THREE.BufferGeometry().setFromPoints([parent.pos, person.pos]);
  const ln = new THREE.Line(g, person.s ? spouseLineMat : lineMat);
  lines.add(ln);
}

// ============================================================
// NARRATIVE MONOLITHS — tall obelisks placed on an outer ring
// ============================================================
const narrGroup = new THREE.Group();
scene.add(narrGroup);

N.forEach((narr, i) => {
  const angle = (i / N.length) * Math.PI * 2;
  const r = 820;
  const x = Math.cos(angle) * r;
  const z = Math.sin(angle) * r;
  const y = 60;

  // Tall prism
  const h = 110;
  const geo = new THREE.ConeGeometry(14, h, 6, 1);
  geo.rotateY(Math.PI / 6);
  const mat = new THREE.MeshPhongMaterial({
    color:0xffd88a, emissive:0xffaa44, emissiveIntensity:0.8,
    shininess:120, specular:0xffffff, transparent:true, opacity:0.85, flatShading:true
  });
  const monolith = new THREE.Mesh(geo, mat);
  monolith.position.set(x, y, z);
  monolith.userData = { kind:'narrative', ref:narr };
  narrGroup.add(monolith);
  pickables.push(monolith);

  // Inverted crown
  const crown = new THREE.Mesh(new THREE.ConeGeometry(18, 32, 6, 1), new THREE.MeshBasicMaterial({
    color:0xffcb70, transparent:true, opacity:0.22, blending:THREE.AdditiveBlending, depthWrite:false
  }));
  crown.position.set(x, y + h/2 + 16, z);
  narrGroup.add(crown);

  // Base halo
  const halo = new THREE.Mesh(new THREE.RingGeometry(25, 50, 32), new THREE.MeshBasicMaterial({
    color:0xffaa44, transparent:true, opacity:0.15, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending
  }));
  halo.rotation.x = -Math.PI/2;
  halo.position.set(x, y - h/2 - 1, z);
  narrGroup.add(halo);

  narr._mesh = monolith;
  narr._pos = new THREE.Vector3(x, y, z);
});

// ============================================================
// INTERACTION — raycaster, detail panel, hover
// ============================================================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hovered = null;

function onPointerMove(e) {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
}
renderer.domElement.addEventListener('pointermove', onPointerMove);

let lastDownTime = 0, lastDownPos = {x:0,y:0};
renderer.domElement.addEventListener('pointerdown', e => {
  lastDownTime = performance.now();
  lastDownPos = {x:e.clientX, y:e.clientY};
});
renderer.domElement.addEventListener('pointerup', e => {
  const dt = performance.now() - lastDownTime;
  const dd = Math.hypot(e.clientX - lastDownPos.x, e.clientY - lastDownPos.y);
  if (dt > 250 || dd > 4) return;  // was a drag, not a click
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  if (hits.length > 0) {
    openTarget(hits[0].object.userData);
  }
});

// ----- detail panel -----
const panel = document.getElementById('panel');
const panelBody = document.getElementById('panel-body');
document.getElementById('close').addEventListener('click', closePanel);

function closePanel() {
  panel.classList.remove('visible');
  setTimeout(()=>{ panel.style.display='none'; }, 260);
}

function openTarget(data) {
  if (data.kind === 'narrative') showNarrative(data.ref);
  else if (data.kind === 'person') showPerson(data.ref);
  focusOn(data.ref._mesh || data.ref._pos || data.ref.pos);
}

function lineageOf(person) {
  const chain = [];
  let cur = person;
  while (cur) { chain.unshift(cur); cur = cur.p ? byId[cur.p] : null; }
  return chain;
}

function showPerson(person) {
  const chain = lineageOf(person);
  const kids = (children[person.id] || []).filter(k => !k.s);
  const spouses = (children[person.id] || []).filter(k => k.s);

  let html = `<div class="gen">Generation ${person.g}${person.s ? ' · Spouse' : ''}</div>`;
  html += `<h2>${person.n}</h2>`;
  if (person._locUrl) {
    html += `<div class="locimg" title="${person._locKey}"><img src="${person._locUrl}" alt="${person._locKey}"><div class="loccap">${person._locKey}</div></div>`;
  }
  if (person.aka) html += `<div class="row"><div class="k">Also</div><div class="v">${person.aka}</div></div>`;
  if (person.b)   html += `<div class="row"><div class="k">Born</div><div class="v">${person.b}</div></div>`;
  if (person.d)   html += `<div class="row"><div class="k">Died</div><div class="v">${person.d}</div></div>`;
  if (person.m)   html += `<div class="row"><div class="k">Married</div><div class="v">${person.m}</div></div>`;
  if (person.loc) html += `<div class="row"><div class="k">Of</div><div class="v">${person.loc}</div></div>`;
  if (person.note) html += `<div class="note">${person.note}</div>`;

  if (chain.length > 1) {
    const lin = chain.map(p => `<span>${p.n.split(' ')[0]}<sup>${p.g}</sup></span>`).join(' → ');
    html += `<div class="lineage">Bloodline: ${lin}</div>`;
  }

  if (spouses.length) {
    html += `<div class="children"><div class="clabel">Spouse${spouses.length>1?'s':''}</div>`;
    for (const sp of spouses) html += `<a data-id="${sp.id}">${sp.n}</a>`;
    html += `</div>`;
  }
  if (kids.length) {
    html += `<div class="children"><div class="clabel">Children (${kids.length})</div>`;
    for (const k of kids) html += `<a data-id="${k.id}">${k.n}</a>`;
    html += `</div>`;
  }

  panelBody.innerHTML = html;
  panelBody.querySelectorAll('a[data-id]').forEach(a => {
    a.addEventListener('click', () => {
      const p = byId[a.dataset.id];
      if (p) { showPerson(p); focusOn(p._mesh); }
    });
  });
  panel.style.display = 'block';
  requestAnimationFrame(()=>panel.classList.add('visible'));
}

function showNarrative(narr) {
  let html = `<div class="gen">Codex · Narrative</div>`;
  html += `<h2>${narr.title}</h2>`;
  if (narr.by) html += `<div class="row"><div class="k">By</div><div class="v">${narr.by}</div></div>`;
  html += `<div class="narr">${narr.text}</div>`;
  panelBody.innerHTML = html;
  panel.style.display = 'block';
  requestAnimationFrame(()=>panel.classList.add('visible'));
}

// Smooth focus-fly-to
let flyTarget = null, flyFrom = null, flyStart = 0;
function focusOn(meshOrPos) {
  const target = meshOrPos.position ? meshOrPos.position : meshOrPos;
  if (!target) return;
  flyFrom = { lookAt: controls.target.clone(), pos: camera.position.clone() };
  const dir = camera.position.clone().sub(target).normalize();
  const dist = (meshOrPos.userData && meshOrPos.userData.kind === 'narrative') ? 120 : 45;
  flyTarget = { lookAt: target.clone(), pos: target.clone().add(dir.multiplyScalar(dist)) };
  flyStart = performance.now();
}
function updateFly() {
  if (!flyTarget) return;
  const t = Math.min(1, (performance.now() - flyStart) / 1200);
  const e = t < 0.5 ? 2*t*t : -1 + (4-2*t)*t;
  camera.position.lerpVectors(flyFrom.pos, flyTarget.pos, e);
  controls.target.lerpVectors(flyFrom.lookAt, flyTarget.lookAt, e);
  if (t >= 1) flyTarget = null;
}

// ============================================================
// INDEX PANEL
// ============================================================
const indexEl = document.getElementById('index');
function buildIndex() {
  let html = '<h3>Narrative</h3>';
  for (const n of N) html += `<a data-narr="${n.id}">${n.title}</a>`;
  html += '<h3>Ancestors (gen 1–4)</h3>';
  P.filter(p=>p.g<=4 && !p.s).forEach(p=>{
    html += `<a data-id="${p.id}">${p.n} <sup style="opacity:.5">gen ${p.g}</sup></a>`;
  });
  html += '<h3>Children of Stephen & Mary (gen 5)</h3>';
  P.filter(p=>p.p==='stephen4' && !p.s && p.g===5).forEach(p=>{
    html += `<a data-id="${p.id}">${p.n}</a>`;
  });
  html += '<h3>Hungarian Branches</h3>';
  P.filter(p=>(p.p==='geza4' || p.p==='matthew4') && !p.s).forEach(p=>{
    html += `<a data-id="${p.id}">${p.n}</a>`;
  });
  indexEl.innerHTML = html;

  indexEl.querySelectorAll('a[data-id]').forEach(a => a.addEventListener('click', () => {
    const p = byId[a.dataset.id]; if (p) { showPerson(p); focusOn(p._mesh); }
  }));
  indexEl.querySelectorAll('a[data-narr]').forEach(a => {
    const narr = N.find(n=>n.id===a.dataset.narr);
    a.classList.add('narrative');
    a.addEventListener('click', () => { showNarrative(narr); focusOn(narr._mesh); });
  });
}
buildIndex();

document.getElementById('toggle-index').addEventListener('click', ()=>indexEl.classList.toggle('hidden'));
addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closePanel();
    flyFrom = { lookAt: controls.target.clone(), pos: camera.position.clone() };
    flyTarget = { lookAt: new THREE.Vector3(0,0,0), pos: new THREE.Vector3(0,220,620) };
    flyStart = performance.now();
  } else if (e.key === 'h' || e.key === 'H') {
    indexEl.classList.toggle('hidden');
  }
});

// ============================================================
// RESIZE
// ============================================================
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ============================================================
// ANIMATE
// ============================================================
const clock = new THREE.Clock();
function animate() {
  const t = clock.getElapsedTime();
  // Hover highlight
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  const h = hits.length > 0 ? hits[0].object : null;
  const restore = (obj) => {
    if (!obj) return;
    if (obj.isSprite) {
      const s = obj.userData.baseScale || 1;
      obj.scale.set(s, s, 1);
      if (obj.userData.frame) {
        const fs = obj.userData.frame.userData.baseScale || s * 1.25;
        obj.userData.frame.scale.set(fs, fs, 1);
        obj.userData.frame.material.opacity = 0.55;
      }
    } else {
      if (obj.material && 'emissiveIntensity' in obj.material) obj.material.emissiveIntensity = 1.0;
      obj.scale.setScalar(1);
    }
  };
  const boost = (obj) => {
    if (!obj) return;
    if (obj.isSprite) {
      const s = (obj.userData.baseScale || 1) * 1.35;
      obj.scale.set(s, s, 1);
      if (obj.userData.frame) {
        const fs = (obj.userData.frame.userData.baseScale || s) * 1.35;
        obj.userData.frame.scale.set(fs, fs, 1);
        obj.userData.frame.material.opacity = 0.9;
      }
    } else {
      if (obj.material && 'emissiveIntensity' in obj.material) obj.material.emissiveIntensity = 2.5;
      obj.scale.setScalar(1.35);
    }
  };
  if (hovered && hovered !== h) restore(hovered);
  if (h) { boost(h); document.body.style.cursor = 'pointer'; }
  else { document.body.style.cursor = ''; }
  hovered = h;

  // Gentle rotation (crystals only) & bobbing of all nodes + photo frames
  for (const c of pickables) {
    if (!c.isSprite) {
      c.rotation.y += 0.003 * (c.userData.spinRate || 0.3);
      c.rotation.x += 0.0015;
    }
    if (c.userData.baseY !== undefined) {
      const y = c.userData.baseY + Math.sin(t * 0.6 + c.userData.bobPhase) * 0.6;
      c.position.y = y;
      if (c.isSprite && c.userData.frame) c.userData.frame.position.y = y;
    }
  }

  updateFly();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

// fade loader once everything is queued
setTimeout(()=>document.getElementById('loader').classList.add('done'), 350);
animate();
</script>
