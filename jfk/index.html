<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JFK · A Life in Time</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #07080c;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
    color: #fff;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* Cosmic backdrop */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 70% 55% at 50% 30%, rgba(50, 80, 170, 0.35) 0%, transparent 60%),
      radial-gradient(ellipse 55% 45% at 50% 75%, rgba(170, 30, 50, 0.32) 0%, transparent 60%),
      radial-gradient(ellipse 100% 70% at 50% 50%, rgba(15, 8, 30, 0.6) 0%, #07080c 80%);
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(1px 1px at 12% 22%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 78% 84%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 38% 64%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 88% 28%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 18% 78%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 58% 14%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 92% 58%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 28% 92%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 4% 48%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 96% 90%, rgba(255,255,255,0.5), transparent);
    opacity: 0.7;
    pointer-events: none;
    z-index: 0;
  }

  /* Top-left brand */
  .brand {
    position: fixed;
    top: 28px; left: 36px;
    font-family: "Times New Roman", serif;
    font-weight: 300;
    letter-spacing: 0.4em;
    font-size: 18px;
    color: rgba(255,255,255,0.75);
    z-index: 100;
  }
  .brand small {
    display: block;
    font-family: -apple-system, sans-serif;
    font-size: 9px;
    letter-spacing: 0.25em;
    margin-top: 4px;
    color: rgba(255,255,255,0.4);
  }

  /* Year readout, floating top-right */
  .year-readout {
    position: fixed;
    top: 28px; right: 36px;
    text-align: right;
    z-index: 100;
    color: rgba(255,255,255,0.9);
  }
  .year-readout .yr {
    font-family: "Times New Roman", serif;
    font-size: 84px;
    font-weight: 300;
    line-height: 0.9;
    letter-spacing: -0.02em;
    transition: opacity 0.2s;
  }
  .year-readout .place {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-top: 6px;
  }

  /* Stage */
  .stage {
    position: fixed;
    inset: 0;
    perspective: 2400px;
    perspective-origin: 50% 55%;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-style: preserve-3d;
  }
  .deck {
    position: relative;
    width: min(1180px, 94vw);
    aspect-ratio: 16 / 9;
    transform-style: preserve-3d;
  }

  /* 16:9 card — sidebar (left) + photo (right) */
  .card {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    border-radius: 18px;
    overflow: hidden;
    display: flex;
    flex-direction: row;
    background: #0d0d12;
    box-shadow:
      0 40px 100px rgba(0,0,0,0.7),
      0 0 0 1px rgba(255,255,255,0.08) inset;
    will-change: transform, opacity, filter;
    transition:
      transform 0.42s cubic-bezier(0.22, 0.61, 0.36, 1),
      opacity 0.30s ease,
      filter 0.30s ease;
    backface-visibility: hidden;
  }

  /* Left sidebar — solid (no bleed-through), all written info */
  .card .side {
    width: 34%;
    min-width: 280px;
    padding: 38px 32px 32px;
    display: flex;
    flex-direction: column;
    background: #0a0a10;
    border-right: 1px solid rgba(255,255,255,0.05);
    color: #fff;
    overflow: hidden;
  }
  .card .side .index {
    font-size: 10px;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.4);
    margin-bottom: 18px;
    font-variant-numeric: tabular-nums;
  }
  .card .side .date {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(180, 200, 240, 0.85);
    margin-bottom: 14px;
  }
  .card .side .title {
    font-size: 26px;
    font-weight: 600;
    line-height: 1.2;
    color: #fff;
    letter-spacing: -0.01em;
    margin-bottom: 16px;
  }
  .card .side .blurb {
    font-size: 13.5px;
    line-height: 1.55;
    color: rgba(255,255,255,0.76);
    margin-bottom: auto;
  }
  .card .side .place {
    margin-top: 18px;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }
  .card .side .weather {
    display: none;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.78);
    line-height: 1.5;
  }
  .card .side .weather.has-data { display: block; }
  .card .side .weather .wx-label {
    font-size: 9px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.42);
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card .side .weather .wx-label::before {
    content: '';
    width: 4px; height: 4px;
    border-radius: 50%;
    background: rgba(140, 200, 255, 0.7);
    box-shadow: 0 0 6px rgba(140, 200, 255, 0.6);
  }
  .card .side .weather .wx-data {
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .card .side .weather .wx-data b { font-weight: 600; color: #fff; }

  /* Right photo region — full uncropped photo, with blurred copy filling dead space */
  .card .photo {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #0d0d12;
  }
  .card .photo .photo-bg {
    position: absolute;
    inset: -60px;
    background-size: cover;
    background-position: center;
    filter: blur(48px) brightness(0.55) saturate(0.7);
    transform: scale(1.1);
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .card .photo .photo-bg.loaded { opacity: 1; }
  .card .photo img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;        /* show entire image, never crop the subject */
    object-position: center;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .card .photo img.loaded { opacity: 1; }
  .card .photo::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(
      270deg,
      rgba(0,0,0,0) 70%,
      rgba(0,0,0,0.22) 100%
    );
  }

  /* Right-edge timeline ticks */
  .timeline {
    position: fixed;
    right: 28px;
    top: 50%;
    transform: translateY(-50%);
    height: 70vh;
    width: 30px;
    z-index: 100;
    pointer-events: auto;
  }
  .timeline .tick {
    position: absolute;
    right: 0;
    width: 8px;
    height: 1px;
    background: rgba(255,255,255,0.3);
    cursor: pointer;
    transition: width 0.18s ease, background 0.18s ease;
  }
  .timeline .tick:hover { width: 16px; background: rgba(255,255,255,0.85); }
  .timeline .tick.active { width: 22px; background: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.6); }
  .timeline .tick.major { width: 14px; background: rgba(255,255,255,0.7); }
  .timeline .tick-cap {
    position: absolute;
    right: 0;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
  }
  .timeline .tick-cap.top { top: -22px; }
  .timeline .tick-cap.bot { bottom: -22px; }

  /* Bottom hint pill */
  .hint {
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    padding: 8px 16px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(255,255,255,0.12);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.65);
    display: flex; gap: 14px; align-items: center;
  }
  .hint .dot { width: 4px; height: 4px; background: rgba(255,255,255,0.4); border-radius: 50%; }

  /* Progress bar at bottom */
  .progress {
    position: fixed;
    left: 0; right: 0;
    bottom: 0;
    height: 2px;
    background: rgba(255,255,255,0.05);
    z-index: 90;
  }
  .progress .fill {
    height: 100%;
    background: linear-gradient(90deg, rgba(120,160,255,0.7), rgba(255,180,180,0.7));
    width: 0%;
    transition: width 0.1s linear;
  }
</style>
</head>

<div class="brand">JFK<small>A LIFE IN TIME</small></div>

<div class="year-readout">

</div>

  <span class="dot"></span>

  <span class="dot"></span>

</div>

<div class="progress"><div class="fill" id="progress"></div></div>

/* ─── Meteostat integration ────────────────────────────────────────────────
   Pulls daily station bulk CSVs (gzipped) from bulk.meteostat.net and
   matches each event's ISO date. CORS-friendly. Pre-1936-ish dates and
   remote stations (Solomons '43, Berlin '45) often have no data — those
   cards simply omit the weather row. */

const STATION_BY_PLACE = {
  "Brookline, MA": "72509",          // Boston Logan
  "Boston, MA": "72509",
  "Hyannis Port, MA": "72509",
  "Cambridge, MA": "72509",
  "Newport, RI": "72508",            // Quonset / Providence
  "New York, NY": "72503",           // LaGuardia
  "Riverdale, NY": "72503",
  "Wallingford, CT": "72504",        // Bradley
  "London, England": "03772",        // Heathrow
  "London Clinic": "03772",
  "Suffolk, England": "03590",       // Wattisham
  "Berlin, Germany": "10381",        // Berlin Tegel
  "West Berlin": "10381",
  "Washington, D.C.": "72405",       // Reagan National
  "Arlington, VA": "72405",
  "Charleston, WV": "72414",         // Yeager
  "Chicago, IL": "72534",            // Midway
  "Cape Canaveral, FL": "74794",     // Patrick AFB
  "Dallas, TX": "72258",             // Love Field
  "Oxford, MS": "72334",             // Memphis
  "Bay of Pigs, Cuba": "78325",      // Havana José Martí
  "Blackett Strait, Solomon Islands": "91517",  // Honiara Henderson
  "Vienna, Austria": "11035",        // Schwechat
  "Caribbean": "78325",              // map Missile Crisis to Havana
};

const MONTHS = { Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,June:5,Jul:6,July:6,
  Aug:7,Sep:8,Sept:8,Oct:9,Nov:10,Dec:11,
  January:0,February:1,March:2,April:3,August:7,September:8,October:9,November:10,December:11 };

function parseISO(dateStr) {
  // "May 29, 1917" / "Aug 2, 1943" / "Oct 16-28, 1962"
  const m = dateStr.match(/^([A-Za-z]+)\s+(\d{1,2})(?:-\d+)?,\s*(\d{4})$/);
  if (!m) return null;
  const month = MONTHS[m[1]];
  if (month == null) return null;
  const d = parseInt(m[2], 10);
  const y = parseInt(m[3], 10);
  return `${y}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

const stationCache = {};        // stationId -> Map<isoDate, row[]> | null (failed)
const inflight = {};            // stationId -> Promise

async function loadStation(stationId) {
  if (stationCache[stationId] !== undefined) return stationCache[stationId];
  if (inflight[stationId]) return inflight[stationId];

  inflight[stationId] = (async () => {
    try {
      // Pre-fetched Meteostat bulk CSVs served from same origin (./weather/)
      const res = await fetch(`./weather/${stationId}.csv`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      const map = new Map();
      for (const line of text.split('\n')) {
        if (!line) continue;
        const cols = line.split(',');
        // Meteostat daily: date,tavg,tmin,tmax,prcp,snow,wdir,wspd,wpgt,pres,tsun
        if (/^\d{4}-\d{2}-\d{2}$/.test(cols[0])) map.set(cols[0], cols);
      }
      stationCache[stationId] = map;
      return map;
    } catch (e) {
      console.warn('Meteostat load failed for', stationId, e.message);
      stationCache[stationId] = null;
      return null;
    }
  })();
  return inflight[stationId];
}

async function fetchWeather(ev) {
  const iso = parseISO(ev.date);
  const station = STATION_BY_PLACE[ev.place];
  if (!iso || !station) return null;
  const map = await loadStation(station);
  if (!map) return null;
  const row = map.get(iso);
  if (!row) return null;
  // [date, tavg, tmin, tmax, prcp, snow, wdir, wspd, wpgt, pres, tsun]
  const f = (i) => (row[i] === '' || row[i] == null) ? null : parseFloat(row[i]);
  return {
    iso, station,
    tavg: f(1), tmin: f(2), tmax: f(3),
    prcp: f(4), snow: f(5),
    wdir: f(6), wspd: f(7),
    pres: f(9), tsun: f(10),
  };
}

function cToF(c) { return c == null ? null : Math.round(c * 9/5 + 32); }
function mmToIn(mm) { return mm == null ? null : (mm / 25.4); }
function kmhToMph(k) { return k == null ? null : Math.round(k * 0.621371); }

function formatWeather(w) {
  const parts = [];
  if (w.tmax != null && w.tmin != null) {
    parts.push(`<b>${cToF(w.tmax)}°</b>/<b>${cToF(w.tmin)}°F</b>`);
  } else if (w.tavg != null) {
    parts.push(`<b>${cToF(w.tavg)}°F</b>`);
  }
  if (w.snow != null && w.snow > 0) {
    const inches = mmToIn(w.snow);
    parts.push(`<b>${inches >= 1 ? Math.round(inches) : inches.toFixed(1)}"</b> snow`);
  } else if (w.prcp != null && w.prcp > 0) {
    const inches = mmToIn(w.prcp);
    parts.push(`<b>${inches >= 1 ? inches.toFixed(1) : inches.toFixed(2)}"</b> rain`);
  }
  if (w.wspd != null && w.wspd > 0) {
    parts.push(`<b>${kmhToMph(w.wspd)}</b> mph wind`);
  }
  if (w.pres != null) {
    parts.push(`<b>${w.pres.toFixed(0)}</b> hPa`);
  }
  return parts.join(' · ');
}

const weatherLoaded = new Set();
async function ensureWeather(idx) {
  if (weatherLoaded.has(idx)) return;
  weatherLoaded.add(idx);
  const ev = EVENTS[idx];
  const w = await fetchWeather(ev);
  if (!w) return;
  const card = cards[idx];
  if (!card) return;
  const slot = card.querySelector('[data-weather]');
  if (!slot) return;
  slot.classList.add('has-data');
  slot.innerHTML = `
    <div class="wx-label">Weather that day</div>
    <div class="wx-data">${formatWeather(w)}</div>
  `;
}

const deck = document.getElementById('deck');
const yearEl = document.getElementById('year');
const placeEl = document.getElementById('place');
const progressEl = document.getElementById('progress');
const timelineEl = document.getElementById('timeline');

// Build cards
EVENTS.forEach((ev, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.idx = i;
  card.innerHTML = `
    <aside class="side">
      <div class="index">${String(i+1).padStart(2,'0')} / ${String(EVENTS.length).padStart(2,'0')}</div>
      <div class="date">${ev.date}</div>
      <div class="title">${ev.title}</div>
      <div class="blurb">${ev.blurb}</div>
      <div class="place">${ev.place}</div>
      <div class="weather" data-weather></div>
    </aside>
    <div class="photo">
      <div class="photo-bg" data-bg></div>
      <img data-photo alt="" loading="lazy" />
    </div>
  `;
  const img = card.querySelector('[data-photo]');
  const bg = card.querySelector('[data-bg]');
  const src = `./photos/${i}.jpg`;
  img.addEventListener('load', () => {
    img.classList.add('loaded');
    bg.style.backgroundImage = `url("${src}")`;
    bg.classList.add('loaded');
  });
  img.addEventListener('error', () => img.remove());
  img.src = src;
  deck.appendChild(card);
});

const cards = Array.from(deck.children);

// Timeline ticks
EVENTS.forEach((ev, i) => {
  const t = document.createElement('div');
  t.className = 'tick' + (i % 4 === 0 ? ' major' : '');
  t.style.top = ((i / (EVENTS.length - 1)) * 100) + '%';
  t.title = `${ev.date} — ${ev.title}`;
  t.dataset.idx = i;
  t.addEventListener('click', () => setTarget(i));
  timelineEl.appendChild(t);
});

// SNAP-ONLY: target is always an integer. CSS transitions on .card animate
// transform/opacity/filter between snapped states, so there is no "between"
// resting state — every input lands on exactly one card.
const N = EVENTS.length;
let target = 0;

const Z_SPACING = 240;       // px between stacked cards along z
const Y_LIFT = 56;           // px each behind-card lifts up over the front
const VISIBLE_BEHIND = 6;
const VISIBLE_FRONT = 2;
const BLUR_PER_STEP = 0.7;

function setTarget(t) {
  const clamped = Math.max(0, Math.min(N - 1, t | 0));
  if (clamped === target) return;
  target = clamped;
  applyLayout();
}

function applyLayout() {
  cards.forEach((card, i) => {
    const offset = i - target;   // 0 = focused, >0 = behind (peeking up), <0 = past

    let opacity, z, yShift, blur, zIndex, transition;

    if (offset < 0) {
      // Past the focus. Fade out FAST in place; do NOT translate forward
      // (so it can never visually overlap the new front card).
      opacity = 0;
      z = 0;
      yShift = 0;
      blur = 0;
      zIndex = 0;
      transition = 'opacity 0.10s ease, transform 0.10s ease, filter 0.10s ease';
    } else if (offset > VISIBLE_BEHIND) {
      // Out of stack band — invisible, parked at the back.
      opacity = 0;
      z = -(VISIBLE_BEHIND + 1) * Z_SPACING;
      yShift = -(VISIBLE_BEHIND + 1) * Y_LIFT;
      blur = 5;
      zIndex = 0;
      transition = 'opacity 0.18s ease';
    } else {
      // In stack (0 .. VISIBLE_BEHIND): fully opaque, solid stack — no bleed.
      opacity = 1;
      z = -offset * Z_SPACING;
      yShift = -offset * Y_LIFT;
      blur = offset * BLUR_PER_STEP;
      zIndex = 1000 - offset;
      transition =
        'transform 0.26s cubic-bezier(0.22, 0.61, 0.36, 1), ' +
        'opacity 0.18s ease, filter 0.18s ease';
    }

    card.style.transition = transition;
    card.style.transform = `translate3d(0, ${yShift}px, ${z}px)`;
    card.style.opacity = String(opacity);
    card.style.filter = blur ? `blur(${blur}px)` : 'none';
    card.style.zIndex = String(zIndex);
    card.style.pointerEvents = (offset === 0) ? 'auto' : 'none';
  });

  // Lazy-load weather for the focus + neighbors
  ensureWeather(target);
  if (target + 1 < N) ensureWeather(target + 1);
  if (target - 1 >= 0) ensureWeather(target - 1);

  // Readouts
  const ev = EVENTS[target];
  yearEl.textContent  = ev.year;
  placeEl.textContent = ev.place;
  progressEl.style.width = ((target / (N - 1)) * 100) + '%';

  // Active tick
  Array.from(timelineEl.querySelectorAll('.tick')).forEach((t, i) => {
    t.classList.toggle('active', i === target);
  });
}

// ── Wheel: standard throttled stepping. Each event steps one card, then a
// short cooldown blocks subsequent events. This is the same pattern Apple
// Photos / TikTok / most card carousels use — predictable, never silently
// swallows a second gesture mid-momentum like a burst-lock approach can. ──
const STEP_COOLDOWN_MS = 220;
let lastStepAt = 0;
window.addEventListener('wheel', (e) => {
  e.preventDefault();
  const now = performance.now();
  if (now - lastStepAt < STEP_COOLDOWN_MS) return;
  if (Math.abs(e.deltaY) < 1) return;        // ignore noise events
  setTarget(target + Math.sign(e.deltaY));
  lastStepAt = now;
}, { passive: false });

// ── Touch: same throttle on swipe-end ──
let touchStartY = null;
window.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
window.addEventListener('touchmove',  (e) => { if (touchStartY != null) e.preventDefault(); }, { passive: false });
window.addEventListener('touchend',   (e) => {
  if (touchStartY == null) return;
  const dy = touchStartY - e.changedTouches[0].clientY;
  touchStartY = null;
  if (Math.abs(dy) < 30) return;
  const now = performance.now();
  if (now - lastStepAt < STEP_COOLDOWN_MS) return;
  setTarget(target + Math.sign(dy));
  lastStepAt = now;
}, { passive: true });

// ── Keyboard ──
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === 'j') { setTarget(target + 1); e.preventDefault(); }
  if (e.key === 'ArrowUp'   || e.key === 'PageUp'   || e.key === 'k') { setTarget(target - 1); e.preventDefault(); }
  if (e.key === 'Home') setTarget(0);
  if (e.key === 'End')  setTarget(N - 1);
});

applyLayout();
</script>

</body>
</html>
